<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單數獨遊戲</title>
    <!-- 連結 App 身份證 -->
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; margin-top: 50px; }
        h1 { color: #333; }
        #board { display: grid; grid-template-columns: repeat(9, 40px); grid-template-rows: repeat(9, 40px); gap: 0px; border: 3px solid #333; background-color: #333; }
        .cell { width: 100%; height: 100%; background-color: white; font-size: 20px; text-align: center; border: 1px solid #ccc; outline: none; box-sizing: border-box; }
        .cell:nth-child(3n) { border-right: 2px solid #333; }
        .cell:nth-child(9n) { border-right: none; }
        .bottom-border { border-bottom: 2px solid #333 !important; }
        .fixed { background-color: #e0e0e0; font-weight: bold; color: #333; }
        .editable { color: #0056b3; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>數獨遊戲</h1>
    <div id="board"></div>
    <button onclick="checkBoard()">完成！檢查答案</button>

    <script>
        const puzzle = [
            5, 3, 0, 0, 7, 0, 0, 0, 0,
            6, 0, 0, 1, 9, 5, 0, 0, 0,
            0, 9, 8, 0, 0, 0, 0, 6, 0,
            8, 0, 0, 0, 6, 0, 0, 0, 3,
            4, 0, 0, 8, 0, 3, 0, 0, 1,
            7, 0, 0, 0, 2, 0, 0, 0, 6,
            0, 6, 0, 0, 0, 0, 2, 8, 0,
            0, 0, 0, 4, 1, 9, 0, 0, 5,
            0, 0, 0, 0, 8, 0, 0, 7, 9
        ];
        const boardDiv = document.getElementById('board');
        for (let i = 0; i < 81; i++) {
            let cell = document.createElement('input');
            cell.type = 'number';
            cell.min = 1; cell.max = 9; cell.className = 'cell';
            let row = Math.floor(i / 9);
            if (row === 2 || row === 5) cell.classList.add('bottom-border');
            if (puzzle[i] !== 0) {
                cell.value = puzzle[i];
                cell.readOnly = true;
                cell.classList.add('fixed');
            } else {
                cell.classList.add('editable');
            }
            boardDiv.appendChild(cell);
        }
function checkBoard() {
            const cells = document.querySelectorAll('.cell');
            const grid = [];
            
            // 1. 將畫面上 81 格嘅數字讀取，變成一個 9x9 嘅陣列
            for (let i = 0; i < 9; i++) {
                grid[i] = [];
                for (let j = 0; j < 9; j++) {
                    // 將輸入嘅文字轉做整數
                    let val = parseInt(cells[i * 9 + j].value);
                    
                    // 檢查玩家係咪有漏填，或者填咗非 1-9 嘅數字
                    if (isNaN(val) || val < 1 || val > 9) {
                        alert('仲有空格未填，或者填錯咗無效嘅數字呀！');
                        return; // 終止檢查
                    }
                    grid[i][j] = val;
                }
            }

            // 2. 準備一個小工具：用嚟檢查 9 個數字有無重複 (利用 Set 集合特性)
            function isValidSet(arr) {
                return new Set(arr).size === 9;
            }

            // 3. 檢查每一橫行 (Row) 同每一直列 (Column)
            for (let i = 0; i < 9; i++) {
                let row = [];
                let col = [];
                for (let j = 0; j < 9; j++) {
                    row.push(grid[i][j]); // 收集橫行數字
                    col.push(grid[j][i]); // 收集直列數字
                }
                if (!isValidSet(row)) { alert('橫行有重複數字或者錯咗，再檢查吓！'); return; }
                if (!isValidSet(col)) { alert('直列有重複數字或者錯咗，再檢查吓！'); return; }
            }

            // 4. 檢查每一個 3x3 宮格 (Box)
            for (let boxRow = 0; boxRow < 3; boxRow++) {
                for (let boxCol = 0; boxCol < 3; boxCol++) {
                    let box = [];
                    for (let i = 0; i < 3; i++) {
                        for (let j = 0; j < 3; j++) {
                            // 找出每個 3x3 宮格對應嘅正確位置
                            box.push(grid[boxRow * 3 + i][boxCol * 3 + j]);
                        }
                    }
                    if (!isValidSet(box)) { alert('有 3x3 宮格入面出現咗重複數字，再睇睇！'); return; }
                }
            }

            // 5. 如果上面全部檢查都無彈出錯誤，即係過晒關！
            alert('🎉 恭喜你！答案完全正確！你太勁啦！');
        }
        
        // 啟動離線大管家
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
